                                            className="block w-full pl-10 pr-3 py-2 border border-gray-700 rounded-lg leading-5 bg-gray-800 text-gray-300 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                            placeholder="Cari Tipe atau Desain..."
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                        />
                                    </div>

                                        onChange={(e) => setFilterType(e.target.value)}
                                    >
                                        <option value="">Semua Tipe</option>
                                        {types.map((t, idx) => (

                                    </select>

                                            }}
                                        />
                                    </div>

                                                <p className="text-sm font-medium text-blue-600 mt-1">{item.design !== '-' ? item.design : 'Standard'}</p>
                                            </div>
                                            <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 border border-green-200">
                                                {item.status || "Ready"}
                                            </span>
                                        </div>

                            </div>
